<style>
:root{--g:#2e6b3a;--g2:#e8f1e6;--bg:#f4f7f3;--t:#1f2a22;--m:#6b776d;--r:#c0392b;--o:#e08a1e;--b:#2f7bbf;--ok:#27964f;--line:#e3e9e1}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
.top{position:sticky;top:0;z-index:5}
header{background:var(--g);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header small{opacity:.85}
.hbtn{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1 0 auto;min-width:56px;padding:12px 6px;font-size:13px;border:0;background:none;font:inherit;color:var(--m);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}
.badge{background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-right:4px}
main{max-width:720px;margin:auto;padding:14px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--m);font-size:13px;margin-top:3px}
.tag{padding:2px 10px;border-radius:12px;font-size:12px;color:#fff;white-space:nowrap}
.t-red{background:var(--r)}.t-or{background:var(--o)}.t-ok{background:var(--ok)}.t-b{background:var(--b)}.t-g{background:#8a948c}
input,select,textarea{width:100%;padding:10px;border:1px solid #cdd6cb;border-radius:8px;font:inherit;margin:4px 0;background:#fff;color:var(--t)}
textarea{min-height:64px;resize:vertical;field-sizing:content;max-height:50vh}
#w_task{min-height:44px}
.btn{border:0;border-radius:8px;padding:9px 14px;font:inherit;color:#fff;background:var(--g);cursor:pointer}
.btn.r{background:var(--r)}.btn.b{background:var(--b)}.btn.o{background:var(--o)}.btn.l{background:#eef2ed;color:var(--t)}
.btn.full{width:100%;margin-top:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
h3{margin:2px 0 8px;font-size:16px}
.sec{font-weight:700;color:var(--m);margin:16px 2px 8px;font-size:14px}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;cursor:pointer;font:inherit;color:var(--t)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:13px;color:var(--m)}
.stat b{display:block;font-size:24px;color:var(--t)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start;font-size:14px;vertical-align:top}
th{color:var(--m);font-weight:600}
.reply{background:var(--g2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.mini{border:0;border-radius:6px;padding:4px 9px;font:inherit;font-size:13px;color:#fff;cursor:pointer;margin:2px}.mini.l{background:#eef2ed;color:var(--t)}
.steps{border-inline-start:3px solid var(--g2);margin:8px 2px 0;padding-inline-start:10px}.step{padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.step:last-child{border-bottom:0}
.warn{background:#fdecea;color:#8a1c12;border:1px solid #f5c2bd;border-radius:8px;padding:7px 10px;margin-top:8px;font-size:13.5px}
.prog{border-color:#b9d3f0;background:#f5f9fe}
.pt td,.pt th{font-size:13px}.pt input{padding:4px;margin:0;width:62px;font-size:13px}
.crow{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.crow:last-child{border-bottom:0}
.card.pend{border-color:#f0c88a;background:#fffaf2}
.x{background:none;border:0;color:var(--r);cursor:pointer;font-size:16px}
#login{max-width:340px;margin:12vh auto;text-align:center;padding:20px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.empty{text-align:center;color:var(--m);padding:22px;background:#fff;border:1px dashed var(--line);border-radius:12px}
details>summary{cursor:pointer;color:var(--g);font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
.loading{text-align:center;padding:40px;color:var(--m)}
</style>
</head>

    S.cash.push({ id: tmp, date: d.date, kind: d.kind, amount: amt, from, to, party: d.party || '', item: d.item || '', category: d.category || '', qty: d.qty || '', notes: d.notes || '', by: me, created: nowStr() });
  }
  if (a === 'delCash') {
    const c = (S.cash || []).find(x => x.id === d.id) || {}, b = cashBal();
    if (c.to && (b[c.to] || 0) + 0.001 < (Number(c.amount) || 0)) throw new Error('مينفعش تتمسح: الفلوس دي اتصرفت خلاص');
    S.cash = (S.cash || []).filter(x => x.id !== d.id);
  }
}
function run(action, data, msg){
  if (data && String(data.id || '').indexOf('tmp') === 0) return toast('استنى ثانية لحد ما يتحفظ');
  try { localApply(action, data); } catch (e) { return toast('⚠ ' + e.message); }
  INFLIGHT++; render(); saveCache(); if (msg) toast(msg);
  QUEUE = QUEUE.then(() => api(action, data)).then(d => {
    INFLIGHT--;
    if (INFLIGHT === 0) { S = d; saveCache(); }
    render(true);
  }).catch(e => {
    INFLIGHT--; toast('⚠ متحفظش: ' + e.message);
    if (INFLIGHT === 0) refresh(true); else render(true);
  });
}
async function refresh(silent){
  if (INFLIGHT) return;
  if (!silent) toast('بيتحدث…');
  try { const d = await api('load'); if (INFLIGHT) return; S = d; saveCache(); render(true); if (!silent) toast('اتحدث ✔'); }
  catch (e) { if (!silent) toast('⚠ ' + e.message); }
}

/* ===================== حساب العمالة الخارجية (اليوميات) ===================== */
function weekRange(off){
  const d = new Date(); const back = (d.getDay() + 1) % 7; // الأسبوع بيبدأ السبت
  d.setDate(d.getDate() - back + off * 7);
  const a = ymd(d); d.setDate(d.getDate() + 6); return [a, ymd(d)];
}
function jobCost(w){
  if (w.pay === 'وحدة') return (Number(w.units) || 0) * (Number(w.rate) || 0);
  return actualOf(w) * (Number(w.rate) || 0);
}
const actualOf = w => (w.actual === '' || w.actual === undefined || w.actual === null) ? Number(w.workers) || 0 : Number(w.actual) || 0;
function payView(){
  const [a, b] = weekRange(PAYWEEK);
  const list = S.work.filter(w => w.date >= a && w.date <= b && isDailyW(w) && w.status === 'تم').sort((x, y) => x.date.localeCompare(y.date));
  const men = l => l.reduce((s, w) => s + (w.pay === 'وحدة' ? 0 : actualOf(w)), 0);

  list.forEach(w => { const c = w.contractor || 'بدون مقاول'; byC[c] = byC[c] || { men: 0, cost: 0, jobs: 0 }; byC[c].jobs++; byC[c].cost += jobCost(w); byC[c].men += w.pay === 'وحدة' ? 0 : actualOf(w); });
  const notDone = S.work.filter(w => w.date >= a && w.date <= b && isDailyW(w) && w.status !== 'تم' && w.date < addDays(0)).length;

  let h = `<div class="card"><h3>💵 سعر اليومية للنفر</h3><div class="row" style="flex-wrap:nowrap;gap:6px">

  h += `<div class="chips"><button class="chip" onclick="PAYWEEK--;render()">‹ اللي قبله</button>
    <span class="chip on" style="cursor:default">${a} → ${b}</span>
    ${PAYWEEK < 0 ? `<button class="chip" onclick="PAYWEEK++;render()">اللي بعده ›</button>` : ''}</div>`;
  h += `<div class="stats"><div class="stat"><b>${men(list)}</b>يومية</div><div class="stat"><b>${list.length}</b>شغلانة</div><div class="stat"><b>${num(total)}</b>جنيه</div></div>`;
  if (noRate) h += `<div class="warn">⚠️ ${noRate} شغلانة من غير سعر — اكتب سعر اليومية فوق أو في الجدول</div>`;
  if (notDone) h += `<div class="muted" style="text-align:center;margin-bottom:8px">${notDone} شغلانة يومية فاتت ولسه متعلمش عليها تم، فمش داخلة في الحساب</div>`;
  if (!list.length) return h + `<div class="empty">مفيش شغل يومية خلص في الأسبوع ده</div>`;
  h += `<div class="sec">حسب المقاول</div><div class="card"><table><tr><th>المقاول</th><th>يومية</th><th>المبلغ</th></tr>
    ${Object.entries(byC).sort((x, y) => y[1].cost - x[1].cost).map(([c, v]) => `<tr><td>${esc(c)}</td><td>${v.men}</td><td><b>${num(v.cost)}</b></td></tr>`).join('')}
    <tr><th>الإجمالي</th><th>${men(list)}</th><th>${num(total)}</th></tr></table></div>`;
  h += `<div class="sec">التفاصيل</div><div class="card" style="overflow-x:auto"><table class="pt"><tr><th>اليوم</th><th>الشغلانة</th><th>مطلوب</th><th>فعلي</th><th>السعر</th><th>المبلغ</th><th></th></tr>
    ${list.map(w => { const u = w.pay === 'وحدة';
      return `<tr><td style="white-space:nowrap">${w.date.slice(5)}</td><td>${esc(w.task)}${w.hosha ? '<div class="muted">' + esc(w.hosha) + '</div>' : ''}<div class="muted">${esc(w.contractor || '')}</div></td>

      <td><button class="mini" style="background:var(--g)" onclick="savePay('${w.id}',${u ? 1 : 0})">حفظ</button></td></tr>`; }).join('')}</table></div>

function copyPay(){
  const [a, b] = weekRange(PAYWEEK);
  const list = S.work.filter(w => w.date >= a && w.date <= b && isDailyW(w) && w.status === 'تم').sort((x, y) => x.date.localeCompare(y.date));
  const byC = {};
  list.forEach(w => { const c = w.contractor || 'بدون مقاول'; (byC[c] = byC[c] || []).push(w); });
  let t = `*حساب العمالة الخارجية* ${a} → ${b}\n`;

    <div class="grid2"><input id="c_date" type="date" value="${addDays(0)}"><input id="c_amt" type="number" min="0" inputmode="decimal" placeholder="المبلغ"></div>`;
  if (CKIND === 'بيع') h += `<input id="c_party" list="tl" placeholder="اسم التاجر">
      <div class="grid2"><input id="c_item" list="il" placeholder="الصنف / الحوشة"><input id="c_qty" placeholder="الكمية (مثلاً 120 صندوق)"></div>`;
  if (CKIND === 'سلفة') h += `<input id="c_party" placeholder="من مين؟">`;
  if (CKIND === 'تحويل') h += `<select id="c_holder">${holders().map(n => `<option value="${escv(n)}">${esc(n)}</option>`).join('')}</select>`;
  if (CKIND === 'مصروف') h += `<textarea id="c_notes" rows="2" placeholder="اتصرف في إيه؟"></textarea>
      <div class="grid2"><select id="c_cat">${BCATS.map(c => `<option value="${c}">${c}</option>`).join('')}</select><input id="c_item" list="il" placeholder="الحوشة (اختياري)"></div>`;
  if (CKIND !== 'مصروف' && CKIND !== 'تحويل') h += `<textarea id="c_notes" rows="2" placeholder="ملاحظة (اختياري)"></textarea>`;
  h += `<datalist id="il">${items.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <datalist id="tl">${[...new Set(CASHL().filter(c => c.kind === 'بيع').map(c => c.party))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <button class="btn full" onclick="addCash('${escv(holder)}')">تسجيل</button></div>`;
  return h;
}
function cashView(){
  const mgr = S.me.role === 'manager';
  if (!mgr) CBOX = 'custody:' + S.me.name;
  const bal = cashBal(), hs = holders();
  const custTot = hs.reduce((a, n) => a + (bal['custody:' + n] || 0), 0);
  let h = '';
  if (mgr) {
    h += `<div class="stats"><div class="stat"><b>${num(bal.main || 0)}</b>الخزنة الأم</div><div class="stat"><b>${num(custTot)}</b>في العهد</div><div class="stat"><b>${num((bal.main || 0) + custTot)}</b>إجمالي النقدية</div></div>
      <div class="chips"><button class="chip ${CBOX === 'main' ? 'on' : ''}" onclick="CBOX='main';render()">🏦 الخزنة الأم</button>
      ${hs.map(n => `<button class="chip ${CBOX === 'custody:' + n ? 'on' : ''}" onclick="CBOX='custody:${escv(n)}';render()">💼 ${esc(n)}: ${num(bal['custody:' + n] || 0)}</button>`).join('')}</div>`;
  } else {
    h += `<div class="card" style="text-align:center"><div class="muted">رصيد عهدتك</div><div style="font-size:30px;font-weight:700">${num(bal[CBOX] || 0)} <span class="muted">جنيه</span></div></div>`;
  }
  h += cashForm();
  const L = ledger(CBOX);
  const months = [...new Set(L.map(x => String(x.c.date).slice(0, 7)))].sort().reverse();
  if (!CMONTH || !months.includes(CMONTH)) CMONTH = months[0] || '';
  if (CBOX !== 'main' && (bal[CBOX] || 0) > 0) h += `<button class="btn l full" style="margin-bottom:10px" onclick="settleCustody('${escv(CBOX.slice(8))}', ${bal[CBOX] || 0})">🔒 تصفية العهدة — رجّع الباقي (${num(bal[CBOX])}) للخزنة الأم</button>`;
  if (!L.length) return h + `<div class="empty">مفيش حركات لسه</div>`;
  const ML = L.filter(x => String(x.c.date).slice(0, 7) === CMONTH);
  const inn = ML.filter(x => x.inn).reduce((a, x) => a + x.a, 0), out = ML.filter(x => !x.inn).reduce((a, x) => a + x.a, 0);
  h += `<div class="chips">${months.map(m => `<button class="chip ${CMONTH === m ? 'on' : ''}" onclick="CMONTH='${m}';render()">${monthName(m)}</button>`).join('')}</div>
    <div class="row muted" style="margin:0 2px 6px"><span>⬇ وارد ${num(inn)}</span><span>⬆ منصرف ${num(out)}</span></div>`;
  h += `<div class="card" style="padding:4px 10px">${ML.slice().reverse().map(x => { const c = x.c;
      const canDel = mgr || (c.kind === 'مصروف' && c.by === S.me.name);
      return `<div class="crow"><div style="flex:1;min-width:0"><div style="white-space:pre-wrap">${cashDesc(c)}</div>
        <div class="muted">${c.date}${c.category ? ' · ' + escv(c.category) : ''}${c.kind !== 'مصروف' && c.notes ? ' · ' + esc(c.notes) : ''}${mgr ? ' · ' + esc(c.by) : ''}</div></div>
        <div style="text-align:end;white-space:nowrap"><b style="color:${x.inn ? 'var(--ok)' : 'var(--r)'}">${x.inn ? '+' : '−'}${num(x.a)}</b><div class="muted">رصيد ${num(x.bal)}</div>
        ${canDel ? `<button class="x" onclick="delCash('${c.id}')">✕</button>` : ''}</div></div>`; }).join('')}</div>`;
  if (mgr && CBOX === 'main') h += custodyInfo(CMONTH) + monthReport(CMONTH);
  return h;
}
/* مصروفات العهد بتظهر تحت الخزنة الأم للعلم بس — اتخصمت وقت التحويل */
function custodyInfo(m){
  const sp = CASHL().filter(c => c.kind === 'مصروف' && String(c.from).indexOf('custody:') === 0 && String(c.date).slice(0, 7) === m).sort(cashSort);
  if (!sp.length) return '';
  const tot = sp.reduce((a, c) => a + (Number(c.amount) || 0), 0);
  return `<details class="card" style="background:#fafafa"><summary>📎 اتصرف من العهد في ${monthName(m)}: ${num(tot)} جنيه</summary>
    <div class="muted" style="margin:6px 0">للعلم بس — المبالغ دي اتخصمت من الخزنة الأم وقت التحويل للعهدة، فمش بتتخصم تاني.</div>
    ${sp.map(c => `<div class="crow"><div style="flex:1"><div style="white-space:pre-wrap">${esc(c.notes)}${c.item ? ' — ' + esc(c.item) : ''}</div><div class="muted">${c.date} · ${escv(c.category)} · ${esc(boxName(c.from))}</div></div><b>${num(c.amount)}</b></div>`).join('')}</details>`;
}
function monthReport(m){
  const L = CASHL().filter(c => String(c.date).slice(0, 7) === m);
  const sum = f => L.filter(f).reduce((a, c) => a + (Number(c.amount) || 0), 0);
  const sales = sum(c => c.kind === 'بيع'), loans = sum(c => c.kind === 'سلفة');
  const exMain = sum(c => c.kind === 'مصروف' && c.from === 'main'), exCust = sum(c => c.kind === 'مصروف' && String(c.from).indexOf('custody:') === 0);
  const byCat = {};
  L.filter(c => c.kind === 'مصروف').forEach(c => byCat[c.category || 'أخرى'] = (byCat[c.category || 'أخرى'] || 0) + (Number(c.amount) || 0));
  return `<div class="sec">📊 ملخص ${monthName(m)}</div><div class="card"><table>
    <tr><td>المبيعات</td><td><b style="color:var(--ok)">${num(sales)}</b></td></tr>
    <tr><td>المصروفات (مباشر ${num(exMain)} + عهد ${num(exCust)})</td><td><b style="color:var(--r)">${num(exMain + exCust)}</b></td></tr>
    <tr><th>صافي المبيعات − المصروفات</th><th>${num(sales - exMain - exCust)}</th></tr>
    ${loans ? `<tr><td class="muted">سلف دخلت (مش إيراد)</td><td class="muted">${num(loans)}</td></tr>` : ''}</table>
    ${Object.keys(byCat).length ? `<div class="chips" style="margin:8px 0 0">${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<span class="chip" style="cursor:default">${escv(c)}: ${num(v)}</span>`).join('')}</div>` : ''}
    <div class="muted" style="margin-top:6px">التحويلات للعهد مش مصروف — دي فلوس اتنقلت من جيب لجيب جوه المزرعة.</div></div>`;
}
function addCash(holder){
  const d = { kind: CKIND, date: val('c_date'), amount: val('c_amt'), party: val('c_party'), item: val('c_item'), qty: val('c_qty'), notes: val('c_notes'), category: val('c_cat') };
  if (!(Number(d.amount) > 0)) return toast('اكتب المبلغ');
  if (CKIND === 'بيع' && !d.party) return toast('اكتب اسم التاجر');
  if (CKIND === 'مصروف' && !d.notes) return toast('اكتب البند اتصرف في إيه');
  if (CKIND === 'تحويل') { d.holder = val('c_holder'); if (!d.holder) return toast('سجّل مهندس الأول من تاب التسجيل'); }
  if (CKIND === 'مصروف' && holder) d.holder = holder;
  run('addCash', d, 'اتسجل ✔');
}
function settleCustody(holder, amt){
  if (!confirm(tr('ترجّع باقي العهدة للخزنة الأم؟') + ' ' + num(amt))) return;
  run('addCash', { kind: 'رد عهدة', holder, amount: amt, date: addDays(0) }, 'اتصفت ✔');
}
function delCash(id){ if (confirm(tr('تمسح الحركة دي؟'))) run('delCash', { id }, 'اتمسحت'); }

/* ===================== الملخص (المدير) ===================== */
function sumView(){
  const td = addDays(0), tm = addDays(1);
  const today = S.work.filter(w => w.date === td), tomo = S.work.filter(w => w.date === tm);
  const c = s => today.filter(w => w.status === s).length;
  const men = l => l.filter(w => (w.ltype || 'يومية') === 'يومية').reduce((a, w) => a + (Number(w.workers) || 0), 0);
  const nextBud = S.budget.filter(b => b.month === S.months.next && b.status !== 'ملغي').reduce((a, b) => a + (Number(b.amount) || 0), 0);
  const curL = S.budget.filter(b => b.month === S.months.current && b.status !== 'ملغي');
  const curTot = curL.reduce((a, b) => a + (Number(b.amount) || 0), 0), curDone = curL.filter(b => b.status === 'تم').reduce((a, b) => a + (Number(b.amount) || 0), 0);
  const openO = S.orders.filter(o => o.status !== 'تم');
  const late = openO.filter(o => o.due && o.due < td).length;

  let h = `<div class="card" style="background:var(--g2);border-color:#cfe0cc"><b>أهلاً ${esc(S.me.name)} 👋</b><div class="muted">${new Date().toLocaleDateString(LANG === 'en' ? 'en-GB' : 'ar-EG', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
    <div class="sec">شغل النهارده (عمالة باليومية: ${men(today)})</div>
    <div class="stats"><div class="stat"><b style="color:var(--ok)">${c('تم')}</b>خلص</div>
    <div class="stat"><b style="color:var(--o)">${c('شغال')}</b>شغال</div>
    <div class="stat"><b style="color:var(--r)">${c('لسه')}</b>لسه</div></div>`;
  const notDone = today.filter(w => w.status !== 'تم');
  if (notDone.length) h += notDone.map(workCard).join('');

  h += `<div class="sec">نظرة سريعة</div>
    <div class="card" onclick="goTab('الطلبات')" style="cursor:pointer"><div class="row"><span>⏳ طلبات مستنية ردك</span><b>${pendingReqs()}</b></div></div>
    <div class="card" onclick="goTab('الشغل')" style="cursor:pointer"><div class="row"><span>⏳ أوامر تشغيل بانتظار اعتمادك</span><b>${S.work.filter(w => w.approval === 'بانتظار').length}</b></div></div>
    <div class="card" onclick="DAY='${tm}';goTab('الشغل')" style="cursor:pointer"><div class="row"><span>📅 شغل بكره</span><b>${tomo.length} شغلانة · ${men(tomo)} عمالة باليومية</b></div></div>
    <div class="card" onclick="BMONTH='current';goTab('البادجيت')" style="cursor:pointer"><div class="row"><span>💰 بادجيت ${monthName(S.months.current)}</span><b>اتنفذ ${num(curDone)} / ${num(curTot)}</b></div></div>
    <div class="card" onclick="BMONTH='next';goTab('البادجيت')" style="cursor:pointer"><div class="row"><span>📝 بادجيت ${monthName(S.months.next)} (تخطيط)</span><b>${num(nextBud)} جنيه</b></div></div>`;
  return h;
}

/* ===================== التسجيل (المدير بس) ===================== */
function normPhone(p){
  p = String(p || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
  if (p.indexOf('0020') === 0) p = p.slice(4);
  else if (p.indexOf('20') === 0 && p.length === 12) p = p.slice(2);
  if (p.length === 10 && p[0] === '1') p = '0' + p;
  return p;
}
const appLink = () => SHARE_LINK || (location.origin + location.pathname);
function usersView(){
  let h = `<div class="card"><h3>➕ تسجيل جديد</h3>
    <input id="u_n" placeholder="الاسم">
    <input id="u_p" type="tel" inputmode="numeric" dir="ltr" style="text-align:right" placeholder="رقم الموبايل (ده اللي هيدخل بيه)">
    <select id="u_r"><option value="engineer">مهندس تنفيذي</option><option value="supervisor">مشرف عمالة</option></select>
    <button class="btn full" onclick="addUser()">تسجيل</button></div>`;
  [['engineer', '👷 المهندسين التنفيذيين'], ['supervisor', '🧑‍🌾 مشرفين العمالة']].forEach(([r, t]) => {
    const l = S.users.filter(u => u.role === r);
    h += `<div class="sec">${t} (${l.length})</div>`;
    h += l.length ? `<div class="card">${l.map(u => `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <div><b>${esc(u.name)}</b><div class="muted" dir="ltr" style="text-align:right">${esc(u.phone)}</div></div>
        <button class="btn l" onclick="delUser('${esc(u.phone)}')">حذف</button></div>`).join('')}</div>` : `<div class="empty">مفيش حد متسجل لسه</div>`;
  });
  h += `<div class="sec">🔗 لينك وQR واحد للكل</div><div class="card" style="text-align:center">
    <div id="qr" style="display:inline-block;padding:10px;background:#fff;border-radius:8px"></div>
    <div class="muted" dir="ltr" style="word-break:break-all;margin:8px 0">${esc(appLink())}</div>
    <button class="btn b" onclick="copyLink()">نسخ اللينك</button>
    <div class="muted" style="margin-top:8px">كل واحد يفتح اللينك ويكتب رقم موبايله بس</div></div>`;
  setTimeout(drawQR, 0);
  return h;
}
function drawQR(){
  const el = document.getElementById('qr');
  if (!el) return;
  if (!window.QRCode) {
    if (!window._qrLoading) { window._qrLoading = 1; const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = drawQR; document.head.appendChild(s); }
    return;
  }
  el.innerHTML = '';
  new QRCode(el, { text: appLink(), width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
}
function copyLink(){
  try { navigator.clipboard.writeText(appLink()).then(() => toast('اتنسخ ✔'), () => toast('انسخه من فوق')); }
  catch (e) { toast('انسخه من فوق'); }
}
function addUser(){
  const name = val('u_n'), phone = normPhone(val('u_p'));
  if (!name) return toast('اكتب الاسم');
  if (phone.length < 8) return toast('اكتب رقم موبايل صح');
  run('addUser', { name, phone, role: val('u_r') }, 'اتسجل ✔');
}
function delUser(phone){ if (confirm(tr('تحذف الشخص ده؟ مش هيقدر يدخل تاني'))) run('delUser', { phone }, 'اتحذف'); }

/* ===================== تحديث تلقائي ===================== */
function formDirty(){
  return [...document.querySelectorAll('main input, main textarea')].some(e => e.type !== 'date' && e.value !== e.defaultValue);
}
setInterval(() => {
  if (S && document.visibilityState === 'visible') refresh(true);
}, 60000);
document.addEventListener('visibilitychange', () => { if (S && document.visibilityState === 'visible') refresh(true); });

/* ===================== البداية ===================== */
let cached = null;
try { cached = JSON.parse(localStorage.getItem('fwp_cache') || 'null'); } catch (e) {}
if (PIN && cached && cached.pin === PIN && cached.S) { S = cached.S; render(); refresh(true); }
else if (PIN) { api('load').then(d => { S = d; saveCache(); render(); }).catch(() => loginView()); }
else loginView();
</script>
</body>
</html>
